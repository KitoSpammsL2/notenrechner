name: Release and deploy

on:
  push:
    tags:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint with flake8
        run: flake8 .
      - name: Test with pytest
        run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: notenrechner-lb324
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
      - name: Check that the app responds
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 12 --retry-delay 15 --retry-all-errors --max-time 120 \
            "${{ steps.deploy.outputs.webapp-url }}"

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --tag "$image:$GITHUB_REF_NAME" .
      - name: Check that the container responds
        run: |
          docker run --detach --publish 8000:8000 "$IMAGE:$GITHUB_REF_NAME"
          curl --fail --silent --show-error --output /dev/null \
            --retry 10 --retry-delay 3 --retry-all-errors "http://localhost:8000/"
      - name: Push image
        run: |
          docker push "$IMAGE:$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            docker tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
